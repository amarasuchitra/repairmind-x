[project]
name = "repairmind-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[google]~=1.8",
  "livekit-api>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
