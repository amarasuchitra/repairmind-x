[project]
name = "repairmind-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[google]~=1.8",
  "livekit-api>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=2.0",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "numpy>=1.26",
  "xlsxwriter>=3.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
# Trained defect detectors (expert mode). Heavy; only needed on machines that run a detector.
detector = ["torch>=2.3", "torchvision>=0.18", "anomalib>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["repairmind*"]
