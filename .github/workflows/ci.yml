name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Every build the app can produce gets its generated code compiled with the real toolchains, so a mistake in
  # the code generator fails here instead of on someone's desk.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: node scripts/sketches.mjs ../sketches
        working-directory: web
      - uses: arduino/setup-arduino-cli@v2
      - name: Install boards and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          # the version the generated code says to use (robot voice needs its classic I2S driver)
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit NeoPixel" "DFRobotDFPlayerMini" "DHT sensor library" "Adafruit Unified Sensor" \
            "Adafruit SSD1306" "Adafruit GFX Library" "Servo" "ESP32Servo@1.2.1" "ESP8266Audio@1.9.7"
          # not in the Library Manager: the same GitHub source the build guide sends people to
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/earlephilhower/ESP8266SAM.git
      - name: Compile every generated sketch
        run: |
          fail=0
          for row in $(jq -c '.[]' sketches/manifest.json); do
            s=$(echo "$row" | jq -r .sketch); b=$(echo "$row" | jq -r .fqbn)
            if arduino-cli compile --fqbn "$b" "sketches/$s" > "sketches/$s.log" 2>&1; then echo "ok   $s ($b)";
            else echo "FAIL $s ($b)"; tail -n 30 "sketches/$s.log"; fail=1; fi
          done
          exit $fail
